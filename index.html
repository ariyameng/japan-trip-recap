  <!-- Leaflet + Leaflet-KML 插件（jsDelivr CDN） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

  <script src="https://cdn.jsdelivr.net/gh/windycom/leaflet-kml@master/L.KML.js"></script>

  <style>
    /* ============================================================
     *  设计系统：纯白底 · 极简 · 日式留白
     *  仅四元素：白底 / 黑字 / 灰线 / 少量朱红点缀
     * ============================================================ */
    :root {
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --text: #1A1A1A;
      --text-muted: #6B6B6B;
      --line: #E8E8E8;
      --line-strong: #D8D8D8;
      --accent: #BC002D;          /* 日系朱红：仅极小面积点缀 */
      --accent-soft: rgba(188, 0, 45, 0.08);
      --font-serif: "Noto Serif JP", "Songti SC", serif;
      --font-sans: "Noto Sans JP", "PingFang SC", "Microsoft YaHei", sans-serif;
      --max-width: 760px;
      --section-padding: 96px 24px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 4rem;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      /* 极淡青海波（Seigaiha）和风纹理：opacity 0.03，仅提供纸张质感，不影响阅读 */
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'40'%20height%3D'20'%20viewBox%3D'0%200%2040%2020'%3E%3Cg%20fill%3D'none'%20stroke%3D'%231A1A1A'%20stroke-width%3D'1'%20opacity%3D'0.03'%3E%3Cpath%20d%3D%22M-40%2020%20a20%2020%200%200%201%2040%200%22%2F%3E%3Cpath%20d%3D%22M-34%2020%20a14%2014%200%200%201%2028%200%22%2F%3E%3Cpath%20d%3D%22M-28%2020%20a8%208%200%200%201%2016%200%22%2F%3E%3Cpath%20d%3D%22M-20%2020%20a20%2020%200%200%201%2040%200%22%2F%3E%3Cpath%20d%3D%22M-14%2020%20a14%2014%200%200%201%2028%200%22%2F%3E%3Cpath%20d%3D%22M-8%2020%20a8%208%200%200%201%2016%200%22%2F%3E%3Cpath%20d%3D%22M0%2020%20a20%2020%200%200%201%2040%200%22%2F%3E%3Cpath%20d%3D%22M6%2020%20a14%2014%200%200%201%2028%200%22%2F%3E%3Cpath%20d%3D%22M12%2020%20a8%208%200%200%201%2016%200%22%2F%3E%3Cpath%20d%3D%22M20%2020%20a20%2020%200%200%201%2040%200%22%2F%3E%3Cpath%20d%3D%22M26%2020%20a14%2014%200%200%201%2028%200%22%2F%3E%3Cpath%20d%3D%22M32%2020%20a8%208%200%200%201%2016%200%22%2F%3E%3Cpath%20d%3D%22M-30%2010%20a20%2020%200%200%201%2040%200%22%2F%3E%3Cpath%20d%3D%22M-24%2010%20a14%2014%200%200%201%2028%200%22%2F%3E%3Cpath%20d%3D%22M-18%2010%20a8%208%200%200%201%2016%200%22%2F%3E%3Cpath%20d%3D%22M-10%2010%20a20%2020%200%200%201%2040%200%22%2F%3E%3Cpath%20d%3D%22M-4%2010%20a14%2014%200%200%201%2028%200%22%2F%3E%3Cpath%20d%3D%22M2%2010%20a8%208%200%200%201%2016%200%22%2F%3E%3Cpath%20d%3D%22M10%2010%20a20%2020%200%200%201%2040%200%22%2F%3E%3Cpath%20d%3D%22M16%2010%20a14%2014%200%200%201%2028%200%22%2F%3E%3Cpath%20d%3D%22M22%2010%20a8%208%200%200%201%2016%200%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
      background-repeat: repeat;
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 400;
      font-size: 16px;
      line-height: 1.9;
      letter-spacing: 0.02em;
    }

    img, iframe, svg { max-width: 100%; }

    a { color: var(--text); text-decoration: none; }
    a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

    /* —— 主体：单栏居中，760 宽，四周留白 —— */
    main#app {
      max-width: var(--max-width);
      margin: 0 auto;
      background: transparent;
    }

    /* —— 区块：大留白；顶层章节之间用“枯山水”弧线分隔（见 .karesansui）—— */
    section {
      padding: var(--section-padding);
    }
    /* 日记内部子章节保留细线分隔 */
    #diary section { border-top: 1px solid var(--line); }
    #diary section:first-of-type { border-top: none; }

    /* —— 排版 —— */
    h1 {
      font-family: var(--font-serif);
      font-weight: 700;
      color: var(--text);
      font-size: clamp(2rem, 5vw, 2.5rem);
      line-height: 1.35;
      letter-spacing: 0.04em;
      margin: 0;
    }
    h2, .section-title {
      font-family: var(--font-serif);
      font-weight: 600;
      color: var(--text);
      font-size: clamp(1.375rem, 3.5vw, 1.625rem);
      line-height: 1.4;
      margin: 0;
    }
    .sec-head {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      margin-bottom: 2.75rem;
    }
    /* 极小的朱红汉字标签：唯一允许的“装饰” */
    .kicker {
      font-family: var(--font-serif);
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1;
    }
    .lead { color: var(--text-muted); font-size: 0.95rem; }

    /* —— 朱红小印章：日记每篇末尾的视觉点缀（22px 方印，微圆角，白字）—— */
    .day-seal {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 3px;
      background: var(--accent); color: #fff;
      font-family: var(--font-serif); font-weight: 700; font-size: 0.78rem;
      line-height: 1; margin-top: 1.2rem;
    }

    /* —— 枯山水分隔：替代水平分割线，作段落间的呼吸停顿 —— */
    .karesansui {
      display: flex; justify-content: center;
      padding: 0; margin: 0; line-height: 0;
    }
    .karesansui svg { display: block; width: 200px; height: 36px; }

    .empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 3rem 0;
    }

    /* ============================================================
     *  顶部导航：sticky 白底毛玻璃，细线底，朱红下划线标识当前项
     * ============================================================ */
    .site-nav {
      position: sticky; top: 0; z-index: 45;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .site-nav ul {
      display: flex; gap: 1.6rem;
      padding: 0.9rem 1rem;
      max-width: var(--max-width); margin: 0 auto;
      overflow-x: auto; scrollbar-width: none;
      list-style: none;
    }
    .site-nav ul::-webkit-scrollbar { display: none; }
    .site-nav a {
      flex: 0 0 auto; white-space: nowrap;
      font-size: 0.85rem; letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 0.2rem 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .site-nav a:hover { color: var(--text); text-decoration: none; }
    .site-nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ============================================================
     *  Hero：纯白、安静、留白
     * ============================================================ */
    .hero { text-align: center; padding-top: 7rem; padding-bottom: 6rem; }
    .hero .eyebrow {
      font-size: 0.8rem; letter-spacing: 0.4em;
      color: var(--text-muted); margin-bottom: 1.75rem;
    }
    .hero .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 1rem; }
    .hero .meta {
      margin-top: 2.5rem; display: inline-block;
      border: 1px solid var(--line); border-radius: 4px;
      padding: 1rem 1.5rem; font-size: 0.85rem; color: var(--text-muted);
    }
    .hero .meta b { color: var(--text); font-weight: 600; }
    .hero .opening {
      margin: 2.5rem auto 0; max-width: 32rem;
      color: var(--text-muted); font-size: 0.95rem; line-height: 2;
    }
    .scroll-hint {
      margin-top: 3rem; color: var(--text-muted);
      font-size: 0.75rem; letter-spacing: 0.3em;
    }

    /* ============================================================
     *  卡片：白底、1px 灰线、0-4px 圆角、无阴影、无悬浮位移
     * ============================================================ */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1.25rem;
    }
    .card:hover { border-color: var(--line-strong); }

    /* —— 台风/出发故事 —— */
    .typhoon-card { border: 1px solid var(--line); border-radius: 4px; padding: 1.75rem; }
    .typhoon-card .mood { font-size: 1.5rem; text-align: center; margin-bottom: 0.6rem; }
    .typhoon-card h3 {
      text-align: center; font-family: var(--font-serif);
      font-weight: 600; font-size: 1.15rem; margin: 0 0 1.25rem;
    }
    .typhoon-story p { margin: 0 0 1.1em; }
    .typhoon-stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
      margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--line);
      text-align: center;
    }
    .typhoon-stats .val {
      font-family: var(--font-serif); font-weight: 700;
      font-size: 1.5rem; color: var(--accent); line-height: 1;
    }
    .typhoon-stats .lbl {
      font-size: 0.7rem; color: var(--text-muted);
      margin-top: 0.45rem; letter-spacing: 0.04em;
    }
    .typhoon-note {
      margin-top: 1.5rem; padding-left: 1rem;
      border-left: 2px solid var(--line);
      color: var(--text-muted); font-size: 0.85rem;
    }

    /* —— 交通时间线 —— */
    .leg-group { margin-bottom: 2.75rem; }
    .leg-group:last-child { margin-bottom: 0; }
    .leg-group-title {
      display: flex; align-items: center; gap: 0.55rem;
      font-family: var(--font-serif); font-weight: 600; font-size: 1rem;
      margin: 0 0 1.5rem;
    }
    .leg-group-title::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); display: inline-block;
    }
    .leg { position: relative; padding-left: 1.75rem; padding-bottom: 1.5rem; }
    .leg:last-child { padding-bottom: 0; }
    .leg::before {
      content: ""; position: absolute; left: 5px; top: 1.5rem; bottom: 0;
      width: 1px; background: var(--line);
    }
    .leg:last-child::before { display: none; }
    .leg .node {
      position: absolute; left: 0; top: 0.4rem;
      width: 11px; height: 11px; border-radius: 50%;
      border: 1px solid var(--line-strong); background: #fff;
    }
    .leg.cancelled .node { border-style: dashed; }
    .leg .leg-head { font-weight: 600; font-size: 0.95rem; }
    .leg.cancelled .leg-head {
      color: var(--text-muted);
      text-decoration: line-through; text-decoration-color: var(--line-strong);
    }
    .leg .leg-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
    .leg .leg-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }
    .leg .leg-reason {
      display: inline-block; margin-top: 0.5rem; font-size: 0.75rem;
      color: var(--text-muted); border: 1px solid var(--line);
      border-radius: 4px; padding: 0.2rem 0.5rem;
    }
    .leg .code {
      font-size: 0.72rem; color: var(--text-muted);
      border: 1px solid var(--line); border-radius: 4px;
      padding: 0.1rem 0.45rem; margin-left: 0.4rem;
    }

    /* —— 路线 —— */
    .route-svg { width: 100%; height: auto; display: block; }
    .city-list { margin-top: 1.75rem; }
    .city-row {
      display: flex; align-items: baseline; gap: 0.6rem;
      padding: 0.85rem 0; border-bottom: 1px solid var(--line);
    }
    .city-row:first-child { border-top: 1px solid var(--line); }
    .city-row .cname { font-family: var(--font-serif); font-weight: 600; }
    .city-row .ckana { font-size: 0.8rem; color: var(--text-muted); }
    .city-row .cdays { margin-left: auto; font-size: 0.8rem; color: var(--text-muted); }
    .city-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
    .stay-link {
      display: inline-flex; gap: 0.4rem; align-items: flex-start;
      font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem;
    }
    .stay-link:hover { color: var(--accent); }

    /* —— 足迹地图（Leaflet + OpenStreetMap） —— */
    .footmap #trip-map {
      width: 100%; height: 400px;
      border: 1px solid var(--line); border-radius: 0;
      background: #fff;
      box-shadow: none;
    }
    /* 地图加载失败时的降级提示 */
    .footmap .map-fallback {
      display: flex; align-items: center; justify-content: center;
      height: 100%; padding: 1.5rem; text-align: center;
      font-size: 0.82rem; color: var(--text-muted); line-height: 1.9;
    }
    /* 极简风格：弱化 Leaflet 控件描边，贴合白底灰线 */
    .footmap .leaflet-bar a {
      border-color: var(--line); color: var(--text);
      background: #fff;
    }
    .footmap .leaflet-bar a:hover { background: var(--accent-soft); color: var(--accent); }
    .footmap .leaflet-popup-content-wrapper,
    .footmap .leaflet-popup-tip { border-radius: 4px; }
    .footmap .leaflet-popup-content { font-family: var(--font-sans); font-size: 0.85rem; margin: 0.6rem 0.9rem; }
    .coord-list {
      list-style: none; padding: 0; margin: 1.5rem 0 0;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.25rem;
    }
    .coord-list li { border-top: 1px solid var(--line); padding-top: 0.6rem; }
    .coord-list .c-city { font-family: var(--font-serif); font-weight: 600; font-size: 0.9rem; }
    .coord-list .c-coord { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }
    .footmap .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 1.25rem; }

    /* —— 味觉地图网格 —— */
    .food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .food-card { border: 1px solid var(--line); border-radius: 4px; padding: 1.25rem; background: var(--surface); }
    .food-card:hover { border-color: var(--line-strong); }
    .food-card .f-name { font-family: var(--font-serif); font-weight: 600; font-size: 1rem; }
    .food-card .f-note { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; }
    .food-card .f-rating { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.75rem; letter-spacing: 0.04em; }
    .food-card .f-rating .star { color: var(--accent); }

    /* —— 日记（details）—— */
    .day-card {
      border: 1px solid var(--line); border-radius: 4px;
      margin-bottom: 1rem; background: var(--surface);
    }
    .day-card > summary {
      list-style: none; cursor: pointer;
      display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.25rem;
    }
    .day-card > summary::-webkit-details-marker { display: none; }
    .day-badge {
      width: 2rem; height: 2rem; flex: 0 0 auto;
      border: 1px solid var(--line-strong); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif); font-weight: 700; font-size: 0.9rem;
    }
    .day-card[open] .day-badge { color: var(--accent); border-color: var(--accent); }
    .day-title { font-family: var(--font-serif); font-weight: 600; font-size: 1.05rem; }
    .day-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.15rem; }
    .chev { margin-left: auto; color: var(--text-muted); transition: transform 0.3s ease; font-size: 1.1rem; }
    .day-card[open] .chev { transform: rotate(180deg); }
    .day-body { padding: 0 1.25rem 1.25rem; border-top: 1px solid var(--line); margin-top: 0; padding-top: 1.1rem; }
    .day-body p { margin: 0 0 1.1em; }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);   /* 桌面端固定 2 列 */
      gap: 16px;
      margin: 28px 0;                          /* 图片组上下各留 24–32px */
    }
    .photo-grid figure { margin: 0; }
    /* 统一 4:3 容器：所有照片裁切居中填充，杜绝原始尺寸忽长忽短 */
    .photo-frame {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #FAFAFA;
      border: 1px solid var(--line);
    }
    .photo-grid img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 0;
      box-shadow: none;
    }
    /* 极小图注：12px 灰字，与图片间距 8px */
    .photo-cap {
      font-size: 12px;
      color: #6B6B6B;
      margin-top: 8px;
      line-height: 1.6;
      text-align: left;
    }
    .spot-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .spot-tags a {
      font-size: 0.78rem; color: var(--text-muted);
      border: 1px solid var(--line); border-radius: 4px; padding: 0.2rem 0.6rem;
    }
    .spot-tags a:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
    /* USJ 项目卡片 */
    .ride-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; margin-top: 1rem; }
    @media (min-width: 560px) { .ride-grid { grid-template-columns: 1fr 1fr; } }
    .ride-card { border: 1px solid var(--line); border-radius: 4px; padding: 0.9rem 1rem; }
    .ride-card .r-name { font-family: var(--font-serif); font-weight: 600; font-size: 0.95rem; }
    .ride-card .r-area { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; }
    .ride-card .r-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem; }
    .ride-card .r-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
    .ride-card .r-tags span {
      font-size: 0.7rem; color: var(--text-muted);
      border: 1px solid var(--line); border-radius: 4px; padding: 0.1rem 0.45rem;
    }
    /* —— 日记新版结构：项目 / 地点 / 感受 —— */
    .day-sec { margin-top: 1.1rem; }
    .day-sec:first-child { margin-top: 0; }
    .day-sec-h {
      font-size: 0.8rem; font-weight: 600; color: var(--text);
      border-left: 2px solid var(--accent); padding-left: 0.5rem;
      margin-bottom: 0.5rem; letter-spacing: 0.04em;
    }
    .day-list { list-style: none; margin: 0; padding: 0; }
    .day-list li {
      position: relative; padding-left: 1rem; margin: 0.35rem 0;
      font-size: 0.92rem; line-height: 1.7;
    }
    .day-list li::before {
      content: ''; position: absolute; left: 0; top: 0.7em;
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    }
    .place-tags { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .place-tag {
      font-size: 0.78rem; color: var(--text);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 0.2rem 0.75rem; background: #fff;
    }
    .day-feel {
      margin: 0; padding: 0.9rem 1.1rem;
      border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0;
      background: var(--accent-soft);
      font-style: italic; font-size: 0.92rem; line-height: 1.85; color: var(--text);
    }

    /* —— 手信 —— */
    .souv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .souv-card { border: 1px solid var(--line); border-radius: 4px; padding: 1.1rem 1.2rem; }
    .souv-card .s-name { font-family: var(--font-serif); font-weight: 600; font-size: 1rem; }
    .souv-card .s-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.3rem; }
    .souv-card .s-note { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.6rem; }

    /* —— 留言墙（Giscus，存 GitHub Discussions） —— */
    /* Giscus 评论区：仅用一条发丝线与留言墙分隔，保持极简 */
    .giscus-wrap { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--line); }

    /* —— 结尾 —— */
    .ending { text-align: center; }
    .ending p { color: var(--text-muted); font-size: 1rem; max-width: 28rem; margin: 1.5rem auto 0; line-height: 2; }
    .ending .sign { font-size: 0.78rem; color: var(--text-muted); margin-top: 2rem; letter-spacing: 0.1em; }
    /* 朱红"线"标记：替代 emoji 🧵（emoji 颜色由系统决定，无法用 CSS 染红） */
    .ending .sign .thread-mark { width: 22px; height: 7px; display: inline-block; vertical-align: -1px; margin: 0 2px; }

    /* —— 页脚：白底细线，文字链回顶 —— */
    .site-footer {
      border-top: 1px solid var(--line);
      padding: 2.5rem 1.5rem; text-align: center;
      font-size: 0.8rem; color: var(--text-muted);
    }
    .site-footer .back-top {
      display: inline-block; margin-top: 1rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--line-strong); padding-bottom: 1px;
      cursor: pointer;
    }
    .site-footer .back-top:hover { color: var(--accent); border-bottom-color: var(--accent); text-decoration: none; }

    /* —— 照片灯箱：纯白叠层 + 仅淡入，无模糊/缩放 —— */
    #lightbox {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: center; justify-content: center; padding: 5vh 5vw;
      background: rgba(255, 255, 255, 0.97); cursor: zoom-out;
    }
    #lightbox.show { display: flex; }
    #lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 0; }
    #lightbox .lb-hint {
      position: absolute; bottom: 5vh; left: 0; right: 0; text-align: center;
      font-size: 0.75rem; color: var(--text-muted);
    }

    /* —— 入场：仅轻微淡入（opacity + 8px）—— */
    .rise { opacity: 0; transform: translateY(8px); animation: riseFade 0.6s ease forwards; }
    @keyframes riseFade { to { opacity: 1; transform: none; } }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }

    .reveal { opacity: 0; transform: translateY(8px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.is-visible { opacity: 1; transform: none; }

    /* —— 无障碍：减弱动效 —— */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .rise { animation: none; opacity: 1; transform: none; }
      .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      .chev { transition: none !important; }
    }

    /* —— 移动端优先修复 —— */
    @media (max-width: 768px) {
      :root { --section-padding: 64px 20px; }
      .typhoon-stats { grid-template-columns: repeat(2, 1fr); gap: 1.5rem 1rem; }
      .photo-grid { grid-template-columns: 1fr; }
      .souv-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <span id="top"></span>

  <!-- 顶部导航（sticky 白底 + 细线） -->
  <nav class="site-nav" aria-label="主导航">
    <ul>
      <li><a href="#overview">行程</a></li>
      <li><a href="#footmap">足迹</a></li>
      <li><a href="#food">味觉</a></li>
      <li><a href="#diary">日记</a></li>
      <li><a href="#guestbook">留言</a></li>
    </ul>
  </nav>

  <main id="app">
    <!-- 渲染输出会到这里 -->
  </main>

  <!-- 照片灯箱（纯白叠层） -->
  <div id="lightbox">
    <img id="lightbox-img" src="" alt="放大查看" />
    <div class="lb-hint">点击任意处关闭</div>
  </div>

  <!-- 数据驱动 -->
  <script src="./data.js"></script>

  <!-- 渲染逻辑 -->
  <script>
    (function () {
      'use strict';

      const D = window.TRIP_DATA;
      const app = document.getElementById('app');

      /* ============================================================
       *  工具函数
       * ============================================================ */

      function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function fmtDate(d) {
        const date = new Date(d);
        if (isNaN(date)) return d;
        return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;
      }

      function fmtFullDate(d) {
        const date = new Date(d);
        if (isNaN(date)) return d;
        return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
      }

      function daysSince(dateStr) {
        const start = new Date(dateStr);
        const now = new Date();
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        return Math.max(0, diff);
      }

      // 按「抵达日本那天」推算第 N 天的日期
      function dayDate(dayNum) {
        try {
          const base = new Date(D.dateRange.japanArrive);
          base.setDate(base.getDate() + Number(dayNum) - 1);
          if (isNaN(base)) return '';
          return `${base.getMonth() + 1}月${base.getDate()}日`;
        } catch (err) {
          return '';
        }
      }

      // 阿拉伯数字 → 中文数字（1-99），保持文案调性
      function cnNum(n) {
        const map = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
        n = Math.floor(Number(n) || 0);
        if (n <= 0) return '零';
        if (n < 10) return map[n];
        if (n < 20) return '十' + (n % 10 ? map[n % 10] : '');
        if (n < 100) return map[Math.floor(n / 10)] + '十' + (n % 10 ? map[n % 10] : '');
        return String(n);
      }

      // 全程天数：优先用 data.js 里的 totalDays，没填就按日期自动算（含首尾）
      function totalDays() {
        if (D.totalDays) return D.totalDays;
        try {
          const s = new Date(D.dateRange.departFrom);
          const e = new Date(D.dateRange.returnTo);
          const diff = Math.floor((e - s) / (1000 * 60 * 60 * 24)) + 1;
          return diff > 0 ? diff : 1;
        } catch (err) {
          return 1;
        }
      }

      function mapsUrl(spot, city) {
        const query = encodeURIComponent(`${spot} ${city} 日本`);
        return `https://www.google.com/maps/search/?api=1&query=${query}`;
      }

      /* ============================================================
       *  模块渲染
       * ============================================================ */

      // 1. 封面
      function renderHero() {
        const days = daysSince(D.dateRange.departFrom);
        const dateText = `${fmtFullDate(D.dateRange.departFrom)} — ${fmtFullDate(D.dateRange.returnTo)}`;
        return `
          <section class="hero">
            <div class="eyebrow rise">旅 行 回 忆 录</div>
            <h1 class="rise delay-1">${escapeHtml(D.title)}</h1>
            <div class="subtitle rise delay-2">${escapeHtml(D.subtitle)}</div>
            <div class="meta rise delay-3">
              <div>${escapeHtml(dateText)}</div>
              <div style="margin-top:.5rem">距这次旅行已经 <b>${days}</b> 天</div>
            </div>
            ${D.openingLine ? `<p class="opening rise">${escapeHtml(D.openingLine)}</p>` : ''}
            <div class="scroll-hint">↓ 向下滑动</div>
          </section>
        `;
      }

      // 2. 出发故事（台风「白海豚」· 三次改签）
      function renderTyphoon() {
        if (!D.typhoon) return '';
        const t = D.typhoon;
        const storyArr = Array.isArray(t.story) ? t.story : (t.story ? [t.story] : []);
        return `
          <section>
            <div class="sec-head"><span class="kicker">旅</span><h2 class="section-title">出发前后</h2></div>
            <div class="typhoon-card rise">
              ${t.mood ? `<div class="mood">${escapeHtml(t.mood)}</div>` : ''}
              ${t.title ? `<h3>${escapeHtml(t.title)}</h3>` : ''}
              <div class="typhoon-story">
                ${storyArr.map(s => `<p>${escapeHtml(s)}</p>`).join('')}
              </div>
              ${t.stats && t.stats.length > 0 ? `
                <div class="typhoon-stats">
                  ${t.stats.map(s => `
                    <div>
                      <div class="val">${escapeHtml(s.value)}</div>
                      <div class="lbl">${escapeHtml(s.label)}</div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
              ${t.note ? `<div class="typhoon-note">${escapeHtml(t.note)}</div>` : ''}
            </div>
          </section>
        `;
      }

      // 3. 交通行程（去程一波三折 + 返程）
      function renderTransports() {
        const tr = D.transports;
        if (!tr) return '';
        return `
          <section id="overview">
            <div class="sec-head"><span class="kicker">程</span><h2 class="section-title">怎么去的</h2></div>
            ${tr.outbound ? renderLegGroup(tr.outbound) : ''}
            ${tr.inbound ? renderLegGroup(tr.inbound) : ''}
          </section>
        `;
      }

      function renderLegGroup(group) {
        const legs = group.legs || [];
        if (legs.length === 0) return '';
        return `
          <div class="leg-group">
            <div class="leg-group-title">${escapeHtml(group.title)}</div>
            ${legs.map((leg, i) => renderLeg(leg, i, legs.length)).join('')}
          </div>
        `;
      }

      function renderLeg(leg, idx, total) {
        const cancelled = leg.status === 'cancelled';
        const isLast = idx === total - 1;
        return `
          <div class="leg ${cancelled ? 'cancelled' : ''}">
            <span class="node"></span>
            <div class="leg-head">
              ${escapeHtml(leg.from)}${leg.to ? ' → ' + escapeHtml(leg.to) : ''}
              ${leg.code ? `<span class="code">${escapeHtml(leg.code)}</span>` : ''}
            </div>
            <div class="leg-time">
              ${escapeHtml(leg.date)}${leg.depart ? '　' + escapeHtml(leg.depart) + ' → ' + escapeHtml(leg.arrive) : ''}
            </div>
            ${leg.note ? `<div class="leg-note">${escapeHtml(leg.note)}</div>` : ''}
            ${cancelled && leg.reason ? `<div class="leg-reason">${escapeHtml(leg.reason)}</div>` : ''}
          </div>
        `;
      }

      // 4. 路线地图（线描 SVG）
      function renderRoute() {
        const cities = D.cities || [];
        if (cities.length === 0) return '';
        return `
          <section>
            <div class="sec-head"><span class="kicker">迹</span><h2 class="section-title">足迹</h2></div>
            ${renderRouteSvg(cities)}
            <div class="city-list">
              ${cities.map(c => `
                <div>
                  <div class="city-row">
                    <span class="cname">${escapeHtml(c.name)}</span>
                    ${c.kana ? `<span class="ckana">${escapeHtml(c.kana)}</span>` : ''}
                    <span class="cdays">${c.days || 0} 天</span>
                  </div>
                  ${c.highlight ? `<div class="city-meta">${escapeHtml(c.highlight)}</div>` : ''}
                  ${c.stay ? renderStay(c.stay) : ''}
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }

      // 住宿 → 可点击的 Google Maps 链接（支持字符串或 {name, en, address}）
      function renderStay(stay) {
        const s = (typeof stay === 'string') ? { name: stay } : (stay || {});
        if (!s.name) return '';
        const query = [s.en || s.name, s.address].filter(Boolean).join(' ');
        const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
        return `
          <a href="${url}" target="_blank" rel="noopener" class="stay-link">
            <span>📍</span>
            <span>
              ${escapeHtml(s.name)}
              ${s.address ? `<span style="color:var(--text-muted)">　${escapeHtml(s.address)}</span>` : ''}
              ${s.dates ? `<span style="color:var(--text-muted)">　${escapeHtml(s.dates)}</span>` : ''}
            </span>
          </a>
        `;
      }

      function renderRouteSvg(cities) {
        const W = 400, H = 140;
        const n = cities.length;
        const pts = cities.map((c, i) => {
          const x = 40 + (W - 80) * (i / Math.max(1, n - 1));
          const yOffset = i % 2 === 0 ? -10 : 12;
          return { x, y: H / 2 + yOffset, c };
        });
        let pathD = `M ${pts[0].x} ${pts[0].y}`;
        for (let i = 1; i < pts.length; i++) {
          const prev = pts[i - 1];
          const cur = pts[i];
          const midX = (prev.x + cur.x) / 2;
          pathD += ` Q ${midX} ${prev.y - 30} ${midX} ${(prev.y + cur.y) / 2} T ${cur.x} ${cur.y}`;
        }
        return `
          <svg class="route-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="行程路线：大阪 → 京都 → 东京 → 镰仓">
            <path d="${pathD}" stroke="#D8D8D8" stroke-width="1.5" fill="none" stroke-dasharray="3 4" />
            ${pts.map(p => `
              <g transform="translate(${p.x}, ${p.y})">
                <circle r="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5" />
                <text y="-14" text-anchor="middle" font-size="12" fill="#1A1A1A"
                      style="font-family:'Noto Serif JP',serif;font-weight:600">${escapeHtml(p.c.name)}</text>
              </g>
            `).join('')}
          </svg>
        `;
      }

      // 5. 每日回忆
      function renderDays() {
        const days = D.days || [];
        const prologue = days.filter(d => d.phase === 'prologue');
        const japan = days.filter(d => d.phase !== 'prologue');
        const prologueHtml = prologue.length ? `
          <section id="diary-prologue">
            <div class="sec-head"><span class="kicker">序</span><h2 class="section-title">序章 · 出发篇</h2></div>
            ${prologue.map(d => renderDayCard(d)).join('')}
          </section>` : '';
        const japanHtml = japan.length ? `
          <section id="diary-japan">
            <div class="sec-head"><span class="kicker">记</span><h2 class="section-title">日本篇</h2></div>
            ${japan.map(d => renderDayCard(d)).join('')}
          </section>` : '';
        return `
          <div id="diary">
            ${prologueHtml}
            ${japanHtml}
          </div>
        `;
      }

      // 印章汉字：按日记轮转，仅作极小的朱红点缀
      const SEAL_CHARS = ['旅', '日', '记', '行'];

      // 统一相册：CSS Grid（桌面 2 列 / 移动 1 列）+ 4:3 定高容器 + cover 裁切 + 极小图注
      // 图注写在 data.js 的 captions 数组里（与 photos 一一对应）
      function renderPhotos(d) {
        const imgs = d.photos || [];
        if (!imgs.length) return '';
        const caps = d.captions || [];
        return `
          <div class="photo-grid">
            ${imgs.map((p, i) => {
              const cap = caps[i] || '';
              return `
                <figure>
                  <div class="photo-frame">
                    <img src="${escapeHtml(p)}" alt="${cap ? escapeHtml(cap) : '旅行回忆照片'}" loading="lazy" class="day-photo" />
                  </div>
                  ${cap ? `<figcaption class="photo-cap">${escapeHtml(cap)}</figcaption>` : ''}
                </figure>`;
            }).join('')}
          </div>`;
      }

      function renderDayCard(d) {
        const isNew = Array.isArray(d.projects) || Array.isArray(d.places) || typeof d.feeling === 'string';
        const rides = d.rides || [];
        const ridesHtml = rides.length > 0 ? `
          <div class="ride-grid">
            ${rides.map(r => `
              <div class="ride-card">
                <div class="r-name">${escapeHtml(r.name)}</div>
                ${r.area ? `<div class="r-area">${escapeHtml(r.area)}</div>` : ''}
                ${r.note ? `<div class="r-note">${escapeHtml(r.note)}</div>` : ''}
                ${r.tags && r.tags.length > 0 ? `
                  <div class="r-tags">${r.tags.map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        ` : '';
        const spots = d.spots || [];
        const spotsHtml = spots.length > 0 ? `
          <div class="spot-tags">
            ${spots.map(s => `
              <a href="${mapsUrl(s, d.city)}" target="_blank" rel="noopener">📍 ${escapeHtml(s)}</a>
            `).join('')}
          </div>
        ` : '';

        // 头部：序章 / 新版（含标题）/ 旧版 三种形态
        let badge, titleLine, subLine;
        if (d.phase === 'prologue') {
          badge = `<span class="day-badge">序</span>`;
          titleLine = `<div class="day-title">${escapeHtml(d.title || d.cityLabel || '')}</div>`;
          subLine = `<div class="day-sub">${escapeHtml(d.dateLabel || '')}${d.cityLabel ? ' · ' + escapeHtml(d.cityLabel) : ''}</div>`;
        } else if (d.title) {
          badge = `<span class="day-badge">${escapeHtml(d.day)}</span>`;
          titleLine = `<div class="day-title">${escapeHtml(d.title)}</div>`;
          subLine = `<div class="day-sub">${escapeHtml(dayDate(d.day))}${d.city ? ' · ' + escapeHtml(d.city) : ''}</div>`;
        } else {
          badge = `<span class="day-badge">${escapeHtml(d.day)}</span>`;
          titleLine = `<div class="day-title">${escapeHtml(d.city || '')}</div>`;
          subLine = `<div class="day-sub">${escapeHtml(dayDate(d.day))}${d.mood ? ' · ' + escapeHtml(d.mood) : ''} ${escapeHtml(d.moodEmoji || '')}</div>`;
        }

        // 正文：新版结构化（项目 / 地点 / 感受）或旧版 story 兜底
        let bodyInner;
        if (isNew) {
          const proj = (d.projects || []).map(p => `<li>${escapeHtml(p)}</li>`).join('');
          const plc = (d.places || []).map(p => `<span class="place-tag">${escapeHtml(p)}</span>`).join('');
          const photos = renderPhotos(d);
          bodyInner = `
            ${proj ? `<div class="day-sec"><div class="day-sec-h">【项目】</div><ul class="day-list">${proj}</ul></div>` : ''}
            ${plc ? `<div class="day-sec"><div class="day-sec-h">【地点】</div><div class="place-tags">${plc}</div></div>` : ''}
            ${photos}
            ${ridesHtml}
            ${d.feeling ? `<div class="day-sec"><div class="day-sec-h">【感受】</div><blockquote class="day-feel">${escapeHtml(d.feeling)}</blockquote></div>` : ''}
          `;
        } else {
          const photos = renderPhotos(d);
          bodyInner = `<p>${escapeHtml(d.story || '')}</p>${photos}${ridesHtml}${spotsHtml}`;
        }

        // 朱红小印章：日记每篇末尾的视觉点缀（序章用「行」，日本篇按 旅/日/记/行 循环）
        const sealChar = d.phase === 'prologue'
          ? '行'
          : SEAL_CHARS[((d.day || 1) - 1) % SEAL_CHARS.length];
        const sealHtml = `<div class="day-seal" aria-hidden="true">${sealChar}</div>`;

        const open = d.expanded ? ' open' : '';
        return `
          <details class="day-card${open}">
            <summary>
              ${badge}
              <span>${titleLine}${subLine}</span>
              <span class="chev">⌄</span>
            </summary>
            <div class="day-body">${bodyInner}${sealHtml}</div>
          </details>
        `;
      }

      // 6. 美食（味觉地图：网格卡片）
      function renderFoods() {
        const foods = D.foods || [];
        const groups = {};
        foods.forEach(f => {
          const c = f.city || '其他';
          (groups[c] = groups[c] || []).push(f);
        });
        const groupKeys = Object.keys(groups);
        return `
          <section id="food">
            <div class="sec-head"><span class="kicker">食</span><h2 class="section-title">味觉地图</h2></div>
            ${foods.length === 0
              ? `<p class="empty">想到啥就加一条。<br>胃比脑子记得清。</p>`
              : `<div class="space-y-7">
                  ${groupKeys.map(city => `
                    <div>
                      <div class="leg-group-title">${escapeHtml(city)}<span style="font-weight:400;color:var(--text-muted);font-size:.8rem;margin-left:.4rem">${groups[city].length} 家</span></div>
                      <div class="food-grid">
                        ${groups[city].map(f => `
                          <div class="food-card">
                            <div class="f-name">${escapeHtml(f.name)}</div>
                            ${f.note ? `<div class="f-note">${escapeHtml(f.note)}</div>` : ''}
                            <div class="f-rating"><span class="star">★</span> 推荐指数：4.8/5</div>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>`
            }
          </section>
        `;
      }

      // 7. 手信
      function renderSouvenirs() {
        const items = D.souvenirs || [];
        return `
          <section>
            <div class="sec-head"><span class="kicker">物</span><h2 class="section-title">手信与小收藏</h2></div>
            ${items.length === 0
              ? `<p class="empty">买了啥、推荐哪家、想再去哪——都贴这儿。</p>`
              : `<div class="souv-grid">
                  ${items.map(s => `
                    <div class="souv-card">
                      <div class="s-name">${escapeHtml(s.name)}</div>
                      <div class="s-meta">${escapeHtml(s.city || '')}${s.type ? ' · ' + escapeHtml(s.type) : ''}</div>
                      ${s.note ? `<div class="s-note">${escapeHtml(s.note)}</div>` : ''}
                    </div>
                  `).join('')}
                </div>`
            }
          </section>
        `;
      }

      // 8. 留言板（替换原「下次再去」愿望清单）
      // 8. 留言：统一用 Giscus（存 GitHub Discussions，人人可见、永久保存）
      function renderGuestbook() {
        return `
          <section id="guestbook">
            <div class="sec-head"><span class="kicker">言</span><h2 class="section-title">留言墙</h2></div>
            <p class="lead" style="margin-bottom:1.5rem">来过的朋友，留句话再走。</p>
            <div class="giscus-wrap">
              <div class="giscus" id="giscus-thread"></div>
            </div>
          </section>
        `;
      }

      // 9. 结尾
      function renderEnding() {
        return `
          <section class="ending">
            <p>
              在日本的那些天已经过去，<br>
              但这些味道和光，<br>
              还有你们留下的字，都还在。
            </p>
            <div class="sign">— 回忆版 · by 红线<svg class="thread-mark" viewBox="0 0 24 7" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M1 3.5 C4 0.6, 7 6.4, 12 3.5 S19 0.6, 23 3.5" stroke="#BC002D" stroke-width="1.3" stroke-linecap="round"/></svg> &amp; 老大</div>
          </section>
        `;
      }

      // 10. 足迹地图（Google Maps 嵌入 + 城市坐标）
      function renderFootMap() {
        const cities = [
          { name: '大阪', en: 'Osaka',    coord: '34.6937° N, 135.5023° E' },
          { name: '京都', en: 'Kyoto',    coord: '35.0116° N, 135.7681° E' },
          { name: '东京', en: 'Tokyo',    coord: '35.6762° N, 139.6503° E' },
          { name: '镰仓', en: 'Kamakura', coord: '35.3196° N, 139.5469° E' },
        ];
        return `
          <section id="footmap">
            <div class="sec-head"><span class="kicker">图</span><h2 class="section-title">足迹地图</h2></div>
            <div class="footmap">
              <div id="trip-map" role="img" aria-label="日本旅行足迹地图：大阪 · 京都 · 东京 · 镰仓"></div>
              <p class="hint">地图中的路线为旅行足迹示意，实际交通方式以日本电车（JR/地铁）为主。</p>
            </div>
            <ul class="coord-list">
              ${cities.map(c => `
                <li>
                  <div class="c-city">${escapeHtml(c.name)} <span style="font-weight:400;color:var(--text-muted)">${escapeHtml(c.en)}</span></div>
                  <div class="c-coord">${escapeHtml(c.coord)}</div>
                </li>
              `).join('')}
            </ul>
          </section>
        `;
      }

      // 11. 页脚 + 回到顶部
      function renderFooter() {
        return `
          <footer class="site-footer">
            <div>© 2026 老大 · 旅行回忆录</div>
            <div style="opacity:.7;margin-top:.4rem;font-size:.78rem">大阪 · 京都 · 东京 · 镰仓 ｜ 13 天治愈之旅</div>
            <span class="back-top" id="back-top">回到顶部</span>
          </footer>
        `;
      }

      /* ============================================================
       *  渲染启动 + 事件绑定
       * ============================================================ */
      // 枯山水：两条极纤细同心弧，作章节之间的呼吸停顿（替代水平分割线）
      const KARESANSUI = `
        <div class="karesansui" aria-hidden="true">
          <svg viewBox="0 0 200 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 29 C72 10, 128 10, 160 29" stroke="#E8E8E8" stroke-width="1" stroke-linecap="round"/>
            <path d="M57 30 C80 16, 120 16, 143 30" stroke="#E8E8E8" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </div>`;

      function render() {
        app.innerHTML = [
          renderHero(),
          renderTyphoon(),
          renderTransports(),
          renderRoute(),
          renderFootMap(),
          renderDays(),
          renderFoods(),
          renderSouvenirs(),
          renderGuestbook(),
          renderEnding(),
          renderFooter(),
        ].join(KARESANSUI);

        // 给非 hero 区块与枯山水分隔注入滚动淡入
        app.querySelectorAll('section:not(.hero), .karesansui').forEach(s => s.classList.add('reveal'));

        bindLightbox();
        bindGiscus();
        bindBackTop();
        bindNavHighlight();
        bindReveal();
        initTripMap();
      }

      // Giscus 多人评论：动态创建 <script>（等价于静态 <script> 标签，适配本站 JS 渲染结构）
      function bindGiscus() {
        const el = document.getElementById('giscus-thread');
        if (!el || el.dataset.loaded) return;
        el.dataset.loaded = '1';
        const s = document.createElement('script');
        s.src = 'https://giscus.app/client.js';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.setAttribute('data-repo', 'ariyameng/japan-trip-recap');
        s.setAttribute('data-repo-id', 'R_kgDOUTVyqA');
        s.setAttribute('data-category', 'Announcements');
        s.setAttribute('data-category-id', 'DIC_kwDOUTVyqM4DFR9m');
        s.setAttribute('data-mapping', 'pathname');
        s.setAttribute('data-strict', '0');
        s.setAttribute('data-reactions-enabled', '1');
        s.setAttribute('data-emit-metadata', '0');
        s.setAttribute('data-input-position', 'bottom');
        s.setAttribute('data-theme', 'preferred_color_scheme');
        s.setAttribute('data-lang', 'zh-CN');
        el.appendChild(s);
      }

      function bindBackTop() {
        const btn = document.getElementById('back-top');
        if (!btn) return;
        btn.addEventListener('click', () => {
          const top = document.getElementById('top');
          if (top) top.scrollIntoView({ behavior: 'smooth' });
        });
      }

      function bindNavHighlight() {
        const links = document.querySelectorAll('.site-nav a');
        if (!links.length) return;
        const targets = [].slice.call(links)
          .map(a => document.querySelector(a.getAttribute('href')))
          .filter(Boolean);
        if (!('IntersectionObserver' in window)) return;
        const obs = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              const id = '#' + e.target.id;
              links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === id));
            }
          });
        }, { rootMargin: '-45% 0px -50% 0px' });
        targets.forEach(s => obs.observe(s));
      }

      // 照片灯箱（纯白叠层 + 仅淡入）
      function bindLightbox() {
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');
        if (!lb) return;
        app.addEventListener('click', function (e) {
          const img = e.target.closest && e.target.closest('.day-photo');
          if (img) {
            lbImg.src = img.getAttribute('src');
            lb.classList.add('show');
            document.body.style.overflow = 'hidden';
          }
        });
        lb.addEventListener('click', function () {
          lb.classList.remove('show');
          document.body.style.overflow = '';
        });
      }

      // 滚动淡入：给非 hero 区块注入 .reveal 后观察
      function bindReveal() {
        const els = [].slice.call(app.querySelectorAll('section.reveal, .karesansui.reveal'));
        if (!els.length) return;
        if (!('IntersectionObserver' in window)) {
          els.forEach(e => e.classList.add('is-visible'));
          return;
        }
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('is-visible');
              obs.unobserve(e.target);
            }
          });
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
        els.forEach(e => obs.observe(e));
      }

      // 足迹地图：Leaflet + OpenStreetMap 交互式地图
      function initTripMap() {
        const el = document.getElementById('trip-map');
        if (!el || el.dataset.inited) return;
        el.dataset.inited = '1';

        // jsDelivr 不可达时的兜底：改用 BootCDN 再加载一次
        whenLeafletReady(function () {
          if (typeof L === 'undefined') {
            el.innerHTML = '<div class="map-fallback">地图组件加载失败（Leaflet CDN 不可达），请检查网络后刷新。</div>';
            return;
          }
          drawTripMap(el);
        });
      }

      // 确保 Leaflet 就绪；若 jsdelivr 失败则回退 BootCDN
      function whenLeafletReady(cb) {
        if (typeof L !== 'undefined') { cb(); return; }
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.css';
        document.head.appendChild(css);
        const s = document.createElement('script');
        s.src = 'https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.js';
        s.onload = cb;
        s.onerror = cb;
        document.head.appendChild(s);
      }

      function drawTripMap(el) {
        const map = L.map(el, { scrollWheelZoom: false }).setView([35.3, 137.5], 6);
        // OpenStreetMap 官方瓦片；瓦片失败时用透明底图避免裂图
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          subdomains: 'abc',
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 贡献者',
          errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
        }).addTo(map);

        fetch('JAPAN%20TRIP.kml')
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          })
          .then(function (txt) {
            if (typeof L.KML !== 'function') throw new Error('KML plugin missing');
            const doc = new DOMParser().parseFromString(txt, 'text/xml');
            const track = new L.KML(doc);
            map.addLayer(track);
            styleKml(track);
            const b = track.getBounds();
            if (b && b.isValid()) map.fitBounds(b, { padding: [24, 24] });
            // reveal 淡入期间容器尺寸可能未稳定，初始化后再修正一次
            setTimeout(function () { map.invalidateSize(); }, 200);
          })
          .catch(function () {
            el.innerHTML = '<div class="map-fallback">足迹路线（JAPAN TRIP.kml）加载失败。<br>请通过本地服务器或已部署的网址打开——直接双击 file:// 打开时，浏览器会拦截读取本地文件。</div>';
          });
      }

      // 极简风：KML 的点标记改为朱红圆点（去重避免堆叠），路线改为朱红细线
      function styleKml(track) {
        const seen = {};
        const layers = (track.getLayers ? track.getLayers() : []).slice();
        layers.forEach(function (layer) {
          if (layer instanceof L.Marker) {
            const ll = layer.getLatLng();
            const key = ll.lat.toFixed(4) + ',' + ll.lng.toFixed(4);
            const popup = layer.getPopup() ? layer.getPopup().getContent() : null;
            track.removeLayer(layer);
            if (seen[key]) return;   // 同一地点在 KML 中反复出现，去重保持画面干净
            seen[key] = true;
            const dot = L.circleMarker(ll, {
              radius: 5, color: '#FFFFFF', weight: 1.5,
              fillColor: '#BC002D', fillOpacity: 0.9
            });
            if (popup) dot.bindPopup(popup);
            dot.addTo(track);
          } else if (layer.setStyle) {
            layer.setStyle({ color: '#BC002D', weight: 2, opacity: 0.55 });
          }
        });
      }

      // 等待数据加载完成
      if (window.TRIP_DATA) {
        render();
      } else {
        document.addEventListener('DOMContentLoaded', function () {
          if (window.TRIP_DATA) render();
        });
      }
    })();
  </script>
</body>
